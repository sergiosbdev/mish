[package]
name = "mish-app"
version = "0.2.1"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
libc = "0.2.191"
mish-proto = { path = "../proto" }
mish-updater = { path = "../updater" }
muda = { version = "0.22.0", default-features = false }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.3"
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "serde"] }
wry = "0.57.3"
zeroize = { version = "1.9.2", features = ["derive", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Touch ID de la caja fuerte (touchid.rs): LAContext + llavero de macOS.
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
security-framework = "3.7.0"
