[package]
name = "mish-updater"
version = "0.2.0"
edition = "2024"
description = "Actualizador de Mish.app desde GitHub Releases (sha256 + firma Ed25519)"
publish = false

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
libc = "0.2.191"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
getrandom = "0.4.3"
zeroize = { version = "1.9.2", features = ["std"] }
